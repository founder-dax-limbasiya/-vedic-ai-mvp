services:
  - type: web
    name: jyoti-vedic-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install ".[geo]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: FRONTEND_ORIGINS
        value: https://YOUR-PROJECT.pages.dev
