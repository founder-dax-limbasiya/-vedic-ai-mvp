services:
  - type: web
    name: jyoti-vedic-ai-api
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: python -m pip install . && python scripts/sync_public_assets.py
    startCommand: uvicorn api.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: FRONTEND_ORIGINS
        value: https://jyoti-vedic-ai-api.onrender.com,http://localhost:5500,http://127.0.0.1:5500
