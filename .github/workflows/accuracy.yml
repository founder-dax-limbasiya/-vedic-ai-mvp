name: independent-accuracy-check
concurrency:
  group: accuracy-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths:
      - "tools/cross_validate.py"
      - "api/app/engine.py"
      - "api/pyproject.toml"
      - "docs/accuracy-validation.md"
      - ".github/workflows/accuracy.yml"
  workflow_dispatch:
jobs:
  cross-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: |
            hip_main.dat
            ~/.local/share/jyotishganit
          key: ${{ runner.os }}-jyotishganit-0.1.7-de421-hipparcos-20250627-v1
      - name: Install optional independent reference engine
        run: pip install -e "./api[accuracy]"
      - name: Compare independent JPL and Swiss calculations
        env:
          HIPPARCOS_CATALOG_URL: https://web.archive.org/web/20250627160000if_/https://cdsarc.cds.unistra.fr/ftp/cats/I/239/hip_main.dat
        run: python tools/cross_validate.py
