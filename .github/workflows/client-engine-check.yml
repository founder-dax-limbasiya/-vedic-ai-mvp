name: Client-side engine checks

on:
  push:
    branches: [client-side-engine-poc]
    paths:
      - "web/engine/**"
      - "tests/client-engine.test.js"
      - "package.json"
      - "scripts/build_client_engine.mjs"
      - "scripts/test_client_browser.mjs"
      - "scripts/generate_python_reference.py"
      - "api/**"
      - ".github/workflows/client-engine-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned Python reference engine
        run: pip install -e ./api

      - name: Generate Python parity reference
        run: python scripts/generate_python_reference.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install open-source dependencies
        run: npm install --no-audit --no-fund

      - name: Run pure calculation tests
        run: npm run test:client

      - name: Build browser WebAssembly engine
        run: npm run build:client

      - name: Install Chromium for the browser smoke test
        run: npx playwright install --with-deps chromium

      - name: Run real browser WebAssembly smoke test
        run: npm run test:browser

      - name: Confirm generated assets
        run: |
          test -s web/engine.bundle.js
          test -s web/swisseph.wasm
          ls -lh web/engine.bundle.js web/swisseph.wasm

      - name: Upload client engine build
        uses: actions/upload-artifact@v4
        with:
          name: jyoti-client-engine-poc
          path: |
            web/engine.bundle.js
            web/swisseph.wasm
          retention-days: 14
