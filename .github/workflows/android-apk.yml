name: Android APK
on:
  push:
    branches: [main, client-side-engine-poc]
    paths:
      - "android/**"
      - "web/**"
      - "scripts/sync_android_assets.py"
      - "scripts/build_client_engine.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser calculation dependencies
        run: npm install --no-audit --no-fund

      - name: Build local WebAssembly calculation engine
        run: npm run build:client

      - name: Bundle local-first PWA assets
        run: python scripts/sync_android_assets.py

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jyoti-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
