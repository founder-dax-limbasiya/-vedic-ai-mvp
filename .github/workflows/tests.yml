name: tests
on:
  push:
  pull_request:
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e './api[test,geo]'
      - run: python -m unittest discover -s api/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/app.js && node --check web/config.js && node --check web/sw.js
      - run: python -c "import json, pathlib, tomllib; json.loads(pathlib.Path('web/manifest.webmanifest').read_text()); tomllib.loads(pathlib.Path('api/pyproject.toml').read_text())"
